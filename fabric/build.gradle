plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

loom {
    mods {
        "beaconobscura" { sourceSet sourceSets.main }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Pull in the shared mixin source
    implementation project(':common')
}

processResources {
    def props = [
        version: project.version,
        mod_id: project.mod_id,
        mod_name: project.mod_name,
        minecraft_version_min: project.minecraft_version_min,
        fabric_loader_version: project.fabric_loader_version
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

jar {
    from(project(':common').sourceSets.main.output)
    from("../LICENSE.txt") { rename { "${it}_${project.archives_base_name}" } }
}
