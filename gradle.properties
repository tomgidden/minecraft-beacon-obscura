# mod_id is the registry id, baked into saved worlds and depended on by
# other mods -- never change it. It also names the jars; set the optional
# archives_base_name only if they must differ.
mod_id=beaconobscura
mod_name=Beacon Obscura
mod_group=cx.gid.minecraft
mod_version=26.3.0

# Minecraft. The _min values are templated into fabric.mod.json and
# neoforge.mods.toml, so the supported ranges live in one place.
minecraft_version=26.3
minecraft_version_min=26.1.2

# Which Minecraft versions this build is PUBLISHED for -- what Modrinth and
# CurseForge advertise. Separate from the two above: minecraft_version is what
# we compile against, minecraft_version_min is the floor the game enforces,
# and this is the tested claim. Must cover both of them or the build fails.
# Exact versions or bounded ranges ("[26.1.2,26.3]"), comma-separated.
minecraft_publish_for_versions=26.1.2,26.2,26.3

# Fabric
fabric_loader_version=0.19.5
fabric_loom_version=1.17-SNAPSHOT

# NeoForge
neoforge_version=26.3.0.4-beta
neoforge_version_min=26.1.2.76
neoforge_moddev_version=2.0.147

# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
